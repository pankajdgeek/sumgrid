# === PROJECT GOAL ===
goal:
  original_prompt: "SumGrid Phase 1 MVP - Puzzle engine, daily puzzle, grid UI, share card, streaks, visual design, Play Store launch"
  expanded_description: |
    SumGrid is a daily number logic puzzle game for Android (Kotlin + Jetpack Compose).
    Players fill an NxN grid so each row and column adds up to a target sum.
    Phase 1 ships a fully playable MVP to Google Play Store with the core daily puzzle
    loop: solve -> celebrate -> share -> streak. No backend required — all puzzles are
    generated client-side from a date seed using a custom xorshift128 PRNG.
    Target: <5 MB APK, offline-first, free, no ads. Min SDK: Android 7.0 (API 24).

    Tech stack: Kotlin, Jetpack Compose, Jetpack DataStore, Firebase Analytics +
    Crashlytics, custom xorshift128 PRNG, constraint-propagation unique-solution validator.

    Critical dev order (must NOT be parallelized):
      Sprint S01 — PRNG + puzzle engine + validator + test suite + grid UI + input
      Sprint S02 — Daily puzzle system + completion flow + share card + streak (depends S01)
      Sprint S03 — Visual design + Firebase + onboarding + Play Store (depends S01 + S02)
  success_criteria:
    - "Puzzle engine generates valid, deterministic, uniquely-solvable puzzles for 3x3/4x4/5x5"
    - "10,000-puzzle test suite passes with zero duplicate-solution failures"
    - "xorshift128 PRNG produces identical output across all Android API 24+ devices"
    - "Grid UI renders correctly on phones 360dp to 420dp width"
    - "Daily puzzle resets at midnight local time; all difficulties share same date seed"
    - "Completion triggers celebration animation and shows elapsed time"
    - "Share card generates a spoiler-free Unicode colored grid via Android Intent"
    - "Streak counter increments on daily completion and persists across app restarts"
    - "Deep indigo/amber Material3 theme with working dark mode"
    - "Firebase Analytics and Crashlytics initialized and receiving events on Day 1"
    - "Onboarding puzzle (1-cell -> 2-cell -> 4-cell progression) plays on first launch"
    - "Play Store listing submitted: 5 screenshots, feature graphic, ASO description"
    - "APK size < 5 MB with R8 full-mode shrinking"
    - "App runs fully offline with no network dependency for core gameplay"
  constraints:
    - "Kotlin + Jetpack Compose only (no Flutter)"
    - "No backend infrastructure — all puzzle generation is client-side from date seed"
    - "APK < 5 MB; CI must fail if release APK exceeds 4.5 MB"
    - "Min SDK: API 24 (Android 7.0); Target SDK: API 35"
    - "Custom xorshift128 PRNG — do NOT use kotlin.random.Random(seed) as sequence may change between Kotlin versions"
    - "Jetpack DataStore for all persistence — NOT SharedPreferences"
    - "Free, no ads, no IAP in Phase 1"
    - "Hard (5x5) and Expert (6x6) difficulties deferred to v1.1"
    - "Sound effects and haptic feedback deferred to Phase 2"
    - "No user accounts, no cloud sync, no server calls for gameplay"
