  - id: "S01-F007"
    name: "Tap-to-select cell interaction"
    description: |
      Wire up tap detection on grid cells. Tapping an empty or user-filled cell
      selects it (highlights it and makes it the target for number pad input).
      Tapping the selected cell again deselects it. Tapping a pre-filled (given)
      cell does nothing. Selection state is a ViewModel-backed StateFlow.
    status: "untested"
    test_file: "app/src/androidTest/kotlin/org/dgeek/sumgrid/ui/CellSelectionTest.kt"
    impl_file: "app/src/main/kotlin/org/dgeek/sumgrid/ui/GridInteraction.kt"
