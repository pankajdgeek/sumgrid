  - id: "S01-F009"
    name: "Real-time row/column sum validation (green/red/gray)"
    description: |
      As the player fills cells, row and column sum indicators update in real time.
      Indicator color: green when current sum equals target, red when current sum
      exceeds target, gray when current sum is less than target (incomplete).
      Updates trigger on every cell value change — no debounce or batching.
      Implemented as a pure computation in the ViewModel from the current grid state.
      No separate "check" button. Sum indicators are the only feedback mechanism.
    status: "untested"
    test_file: "app/src/test/kotlin/org/dgeek/sumgrid/viewmodel/SumValidationTest.kt"
