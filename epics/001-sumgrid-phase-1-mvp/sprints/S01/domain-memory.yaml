  - id: "S01-F008"
    name: "Bottom number pad input"
    description: |
      Implement NumberPad as a @Composable showing buttons 1 through 9 (and a clear
      button). Positioned at the bottom of the screen within comfortable thumb reach
      on 360dp+ phones. When a cell is selected, tapping a number fills it. Tapping
      the same number again (or the clear button) clears the cell. Tapping a number
      when no cell is selected does nothing. Number pad is hidden when the puzzle is
      complete. Input is reflected immediately in the grid via ViewModel.
    status: "untested"
    test_file: "app/src/androidTest/kotlin/org/dgeek/sumgrid/ui/NumberPadTest.kt"
    impl_file: "app/src/main/kotlin/org/dgeek/sumgrid/ui/NumberPad.kt"
