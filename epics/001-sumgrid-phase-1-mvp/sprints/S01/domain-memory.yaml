  - id: "S01-F006"
    name: "Compose Canvas grid renderer"
    description: |
      Implement GridRenderer as a @Composable using Canvas. Draws an NxN grid with
      cells sized to fill the available width (minus padding). Each cell shows its
      current value (or empty). Row sum targets appear to the right of each row;
      column sum targets appear below each column. Must work correctly at 360dp and
      420dp screen widths. Cells visually distinguish: empty, pre-filled (given),
      and user-filled. Selected cell has a distinct highlight border.
    status: "untested"
    test_file: "app/src/androidTest/kotlin/org/dgeek/sumgrid/ui/GridRendererTest.kt"
    impl_file: "app/src/main/kotlin/org/dgeek/sumgrid/ui/GridRenderer.kt"
