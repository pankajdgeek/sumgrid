  - id: "S02-F004"
    name: "Celebration animation (cascade effect, low-end device safe)"
    description: |
      On puzzle completion, play a cell-by-cell cascade animation where each cell
      briefly scales up and turns a brighter green. Animate cells in reading order
      (row 0 left-to-right, then row 1, etc.) with a 50ms stagger between cells.
      Total animation: < 1.5 seconds. Implemented with Compose animateFloatAsState
      or updateTransition — no Lottie, no external animation library. Must maintain
      >= 30fps on a device with 2GB RAM. Animation is interruptible (player can tap
      the share button without waiting for it to finish).
    status: "untested"
    test_file: "app/src/androidTest/kotlin/org/dgeek/sumgrid/ui/CelebrationAnimationTest.kt"
