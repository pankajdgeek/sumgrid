    description: |
      Implement StreakRepository using DataStore<Preferences>. Tracks: currentStreak
      (Int), lastCompletionDate (LocalDate), longestStreak (Int). On daily puzzle
      completion: if lastCompletionDate == yesterday, increment currentStreak; if
      lastCompletionDate == today, no-op (already counted); if lastCompletionDate
      is older, reset to 1. Update longestStreak if currentStreak exceeds it.
      Streak is evaluated per difficulty — completing ANY difficulty on a day
