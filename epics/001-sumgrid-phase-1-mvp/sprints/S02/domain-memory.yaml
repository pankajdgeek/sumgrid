  - id: "S02-F003"
    name: "Puzzle completion detection"
    description: |
      In PuzzleViewModel, detect when the puzzle is complete: all empty cells have
      been filled AND every row sum equals its target AND every column sum equals
      its target. Exposes isComplete: StateFlow<Boolean>. On transition from false
      to true, records the completion timestamp and elapsed time in DataStore.
      Prevents re-triggering if the player somehow modifies a complete puzzle.
    status: "untested"
    test_file: "app/src/test/kotlin/org/dgeek/sumgrid/viewmodel/CompletionDetectionTest.kt"
