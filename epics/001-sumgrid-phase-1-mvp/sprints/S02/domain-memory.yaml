goal:
  original_prompt: "SumGrid Phase 1 MVP - Sprint S02: Daily Puzzle Loop"
  expanded_description: |
    Sprint S02 wires up the complete daily player loop on top of the S01 engine.
    After S02, a player can: open the app, see today's puzzle, solve it, watch
    the celebration animation, see their time, share a spoiler-free grid card
    via Android sharing Intent, and see their streak updated. The home screen
    shows the current streak, today's completion status, and a countdown to the
    next puzzle.

    Key design decisions:
    - Date seed = LocalDate.now(ZoneId.systemDefault()).toEpochDay() cast to Long
    - Difficulty seed offset: Beginner uses seed, Easy uses seed+1, Medium uses seed+2
    - Background precompute: WorkManager job generates today's and tomorrow's puzzles
      on app start and after midnight so the first tap is never slow
    - Streak persistence: DataStore<Preferences>, not SharedPreferences
    - Share card: Unicode emoji colored grid (gray square = given cell, green square =
      correctly placed by user), no numbers, no spoilers
    - Timer: starts when first cell is tapped, stops on completion, hidden during play

  success_criteria:
    - "DailyPuzzleRepository returns the same puzzle for a given date+difficulty on any device"
    - "Puzzle resets at midnight local time (new puzzle available on new calendar day)"
    - "Background precompute fires on app start if today's puzzle not yet cached"
    - "Completion detection triggers when all cells are filled and all sums match targets"
    - "Celebration animation plays on completion (cascade of green cells)"
    - "Animation is skippable and runs correctly on low-end devices (no dropped frames at 30fps)"
    - "Timer starts on first user cell tap; stops on completion; displays MM:SS on completion card"
    - "Difficulty selector shows Beginner / Easy / Medium with correct labels on home screen"
    - "Share card text matches expected format: 'SumGrid #N — Difficulty TIME\\n[grid]\\nPlay free -> sumgrid.dgeek.org'"
    - "Share Intent opens Android native share sheet with pre-populated share card text"
    - "Streak increments by 1 when a daily puzzle is completed for the first time that day"
    - "Streak resets to 0 if no daily puzzle is completed for a full calendar day"
    - "Streak persists across app restarts (DataStore backed)"
    - "Milestone badges display at streaks 7, 30, 100, 365"
    - "Home screen shows: today's puzzle status, active streak count, countdown to midnight"

  constraints:
    - "Requires S01 to be fully passing before implementation starts"
    - "Use LocalDate and ZoneId for all date calculations — no System.currentTimeMillis() for date logic"
    - "DataStore<Preferences> for streak and puzzle completion state — NOT SharedPreferences"
    - "Background precompute must use WorkManager (not foreground service, not coroutine on main)"
    - "Celebration animation must use Compose animation APIs only — no Lottie, no GIF"
    - "Share card must be plain Unicode text (no image generation in MVP)"
    - "Share card must NOT reveal any numbers — only emoji squares"

features:
  - id: "S02-F001"
    name: "Daily puzzle system (date seed, midnight local reset, timezone-aware)"
    description: |
      Implement DailyPuzzleRepository. Given a date (LocalDate) and difficulty, returns
      a deterministic Puzzle by seeding xorshift128 with the epoch day of the date
      (plus a difficulty offset: 0 for Beginner, 1 for Easy, 2 for Medium).
      Exposes today() and tomorrow() methods. Handles timezone correctly using
      ZoneId.systemDefault() — "today" is based on the device's local clock.
      Persists today's completed state in DataStore so app restarts don't reset.
    status: "untested"
    test_file: "app/src/test/kotlin/org/dgeek/sumgrid/daily/DailyPuzzleRepositoryTest.kt"
    impl_file: "app/src/main/kotlin/org/dgeek/sumgrid/daily/DailyPuzzleRepository.kt"
    priority: 21
    dependencies: ["S01-F001", "S01-F002"]
    domain: "backend"
