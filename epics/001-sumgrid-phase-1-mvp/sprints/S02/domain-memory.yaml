      error: null
    attempts: []

  - id: "S02-F002"
    name: "Background precompute of today's and tomorrow's puzzle"
    description: |
      Implement a WorkManager OneTimeWorkRequest that runs on app start (if today's
      puzzle is not yet cached). Pre-generates today's puzzle for all three difficulties
      and tomorrow's puzzles, stores them in DataStore. This ensures the first puzzle
      load is instant even on slow devices. Worker is idempotent — safe to re-run.
    status: "untested"
    test_file: "app/src/test/kotlin/org/dgeek/sumgrid/daily/PuzzlePrecomputeWorkerTest.kt"
    impl_file: "app/src/main/kotlin/org/dgeek/sumgrid/daily/PuzzlePrecomputeWorker.kt"
