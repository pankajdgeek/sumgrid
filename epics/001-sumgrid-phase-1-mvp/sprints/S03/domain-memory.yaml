goal:
  original_prompt: "SumGrid Phase 1 MVP - Sprint S03: Polish, Firebase, Onboarding, and Play Store"
  expanded_description: |
    Sprint S03 transforms the functional app from S01+S02 into a shippable, polished
    product. It covers the visual design system (deep indigo/amber/dark mode),
    accessibility requirements, Firebase integration, the first-time user experience
    (onboarding puzzle), the in-app review prompt, and the complete Play Store listing.

    Visual design decisions:
    - Primary background: deep indigo (#1A1040 equivalent in OKLCH)
    - Accent/sums: amber (#F59E0B equivalent in OKLCH)
    - Grid cells: white/near-white backgrounds with indigo borders
    - Dark mode: system-following via isSystemInDarkTheme(), ships at launch
    - Typography: Material3 defaults, dynamic text sizing via LocalDensity

    Onboarding puzzle design:
    - Curated 3x3 puzzle with only 1 empty cell (trivially solved in < 10 seconds)
    - On solve: brief celebration + tooltip "Come back tomorrow for a new puzzle"
    - Second launch: 3x3 with 2 empty cells
    - Third launch: 3x3 with 4 empty cells
    - Fourth launch onwards: standard daily puzzle system
    - No tutorial screens, no text walls — learning by doing

    Firebase events to track from Day 1:
    - puzzle_started (difficulty, date)
    - puzzle_completed (difficulty, date, elapsed_seconds)
    - puzzle_abandoned (difficulty, date, cells_filled)
    - share_tapped (difficulty, date)
    - streak_milestone (streak_days)
    - onboarding_completed (attempt_number)
    - app_open (daily)

  success_criteria:
    - "Deep indigo background and amber accents render correctly in light and dark mode"
    - "Dark mode follows system setting and switches without app restart"
    - "App renders correctly at 360dp width (minimum supported) with no clipping"
    - "All interactive elements meet 48dp minimum touch target size"
    - "Colorblind indicators: row/column headers show checkmark (complete) + X (error) alongside color"
    - "Dynamic text sizing: app layout is not broken at font scale 0.85x, 1.0x, or 1.3x"
    - "Firebase Analytics receives puzzle_started and puzzle_completed events during smoke test"
    - "Firebase Crashlytics initialized — test crash button visible in debug build only"
    - "Onboarding puzzle sequence plays correctly on first three launches"
    - "From fourth launch onward, onboarding is skipped and daily puzzle is shown"
    - "In-app review prompt appears after the third puzzle completion (not before)"
    - "In-app review prompt does NOT appear if the device Play Store is unavailable"
    - "Play Store: 5 screenshots prepared in correct dimensions (1080x1920px)"
    - "Play Store: feature graphic prepared (1024x500px)"
    - "Play Store: ASO-optimized short description (80 chars max) and long description drafted"
    - "APK size < 5 MB in release build with R8 full mode enabled"

  constraints:
    - "Requires S01 and S02 to be fully passing before implementation starts"
    - "Material3 theming via MaterialTheme — do NOT hardcode colors as hex literals"
    - "Design tokens in a single Theme.kt file — Color.kt, Type.kt, Shape.kt as per Material3 convention"
    - "TalkBack/screen reader support: all cells and interactive elements have contentDescription"
    - "Firebase must be initialized in Application.onCreate() — not lazily"
    - "In-app review must use Google Play In-App Review API (com.google.android.play:review)"
    - "Play Store screenshots must be taken from a real or emulator device (not designed in Figma)"
    - "No sound effects in S03 — deferred to Phase 2"

