      in dark. Error: standard Material3 red. Define Color.kt with named OKLCH-derived
      constants. Define LightColorScheme and DarkColorScheme in Theme.kt.
      Apply via MaterialTheme wrapping the entire app in MainActivity.
      Every color in the app must reference a theme token — zero hardcoded hex values.
    status: "untested"
