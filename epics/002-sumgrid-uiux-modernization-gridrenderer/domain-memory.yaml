# === PROJECT GOAL ===
goal:
  original_prompt: "SumGrid UI/UX Modernization - GridRenderer theme refactor, TalkBack accessibility, haptic feedback, animated transitions, custom typography, celebration animations"
  expanded_description: >
    Transform SumGrid from a functional puzzle app into a premium daily ritual through four
    phases of targeted visual polish, accessibility fixes, and tactile feedback. Work is
    organized as mandatory technical-debt cleanup (S00) followed by three incremental
    quality sprints (S01-S03). Each sprint boundary is a natural releasable increment.
    Stack: Kotlin + Jetpack Compose + Material3. minSdk 24. APK hard cap 4.5MB (~3.5MB
    current, ~1MB headroom). 552 passing tests must remain green throughout.
  success_criteria:
    - "GridRenderer renders correctly in both light and dark mode using MaterialTheme tokens — zero hardcoded color constants"
    - "TalkBack can announce every grid cell: row, column, value, given/editable state"
    - "CelebrationAnimation plays on puzzle completion (currently wired to nothing)"
    - "Haptic feedback fires on cell tap, number entry, clear action, and puzzle completion"
    - "Screen transitions use fade+slide via AnimatedNavHost — no bare NavHost usage"
    - "Outfit Variable font replaces Roboto in Type.kt; APK growth <=110KB"
    - "Predictive back gesture enabled in manifest and Compose Navigation"
    - "Expanded Material3 palette (~30 tokens): tertiary, surface variants, tonal elevation"
    - "Home and Puzzle screens have subtle vertical gradient backgrounds via Brush API"
    - "Splash screen uses core-splashscreen library with branded SumGrid icon"
    - "Streak counter animates scale-up on increment; flame icon pulses"
    - "Dark mode uses OLED-optimized true darks with intentional elevated surfaces"
    - "Cell selection: Canvas spring pulse (scale 1.0->1.05->1.0, 200ms spring)"
    - "Sum indicator: correct sum = green pulse + checkmark scale-in; over = 3px shake 300ms"
    - "Celebration is multi-phase: ripple wave + Canvas confetti particles + stats card slide-up"
    - "Edge-to-edge polish: dynamic status bar coloring and proper insets handling"
    - "APK stays under 4.5MB hard cap through all sprints"
    - "Frame time <12ms on API 24 emulator for all animated paths"
    - "Zero regressions in 552 existing tests; new behavior covered by tests"
  constraints:
    - "APK hard cap 4.5MB — kill criterion if exceeded (stop all work)"
    - "Frame time <12ms on API 24 / 2GB RAM emulator — remove offending animation if exceeded"
    - "No visual-only state information without TalkBack/accessibility parallel"
    - "All animations must respect ANIMATOR_DURATION_SCALE system setting"
    - "GridRenderer Canvas coordinate math MUST NOT be changed — color refactor only in S00"
    - "No new library dependencies without explicit APK impact calculation"
    - "minSdk 24 — APIs above 24 require compat wrappers"
    - "Canvas-to-LazyGrid GridRenderer rewrite is out of scope — defer to separate ticket"
    - "Phase 4 (theme variants, sound effects, stats dashboard) is out of scope for this epic"
    - "If >5 dev days consumed before first releasable increment, ship what exists and stop"

