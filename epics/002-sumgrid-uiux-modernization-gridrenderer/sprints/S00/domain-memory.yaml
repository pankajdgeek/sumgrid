goal:
  original_prompt: "Phase 0 — Fix Technical Debt First: GridRenderer color refactor, TalkBack semantics, wire CelebrationAnimation"
  expanded_description: >
    Day 1 mandatory work. Unblocks all subsequent UI theme work and fixes the critical
    accessibility gap (Canvas grid is completely invisible to TalkBack). Three independent
    tasks that can be tackled in parallel but S00-F001 should be validated first since it
    touches GridRenderer.kt which is a 270 LOC monolithic DrawScope. IMPORTANT: only
    extract the 9 hardcoded color constants to theme-derived parameters — do NOT touch
    coordinate math, cell sizing, or layout logic. All 552 existing tests must pass after
    each feature is complete.
  success_criteria:
    - "Grid renders correctly (light + dark) with MaterialTheme tokens — grep for hardcoded hex in GridRenderer.kt returns zero results"
    - "TalkBack announces: 'Row N, Column M, value V, given' or 'Row N, Column M, empty, editable' for every cell"
    - "CelebrationAnimation plays automatically when puzzle completes — not just the text banner"
    - "All 552 pre-existing tests pass after each change"
    - "APK size does not increase (color refactor and semantics are zero-size additions)"
  constraints:
    - "GridRenderer Canvas coordinate math MUST NOT be touched — colors only"
    - "Semantics must not introduce layout recomposition — use Modifier.semantics only"
    - "CelebrationAnimation wiring must not break existing puzzle completion flow"
    - "Do not add any new library dependencies in this sprint"

