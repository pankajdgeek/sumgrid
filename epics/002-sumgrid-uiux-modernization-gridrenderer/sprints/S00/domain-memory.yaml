features:
  - id: "S00-F001"
    name: "GridRenderer color refactor to theme tokens"
    description: >
      GridRenderer.kt lines 30-38 contain 9 hardcoded color constants (e.g., gridLineColor,
      cellBackgroundColor, givenNumberColor, editableNumberColor, selectedCellColor,
      errorCellColor, correctCellColor, sumIndicatorColor, borderColor). Extract these to
      function parameters with defaults derived from MaterialTheme.colorScheme. The call
      site in the Composable that invokes GridRenderer must pass theme colors.
      Zero change to DrawScope coordinate math. Verify grid renders correctly in both
      light and dark mode after change.
    status: "passing"
    test_file: "app/src/test/kotlin/org/dgeek/sumgrid/ui/GridRendererTest.kt"
    impl_file: "app/src/main/kotlin/org/dgeek/sumgrid/ui/components/GridRenderer.kt"
