      result: null
      error: null
    attempts: []

  - id: "S00-F003"
    name: "Wire CelebrationAnimation to PuzzleScreen"
    description: >
      CelebrationAnimation.kt and CelebrationCellWrapper exist but are never invoked on
      puzzle completion. In PuzzleScreen.kt, detect the puzzle-complete state (isPuzzleSolved
      or equivalent) and conditionally render the CelebrationAnimation composable.
      The celebration should overlay the grid and auto-dismiss after its animation completes.
      The existing text banner ("Puzzle Complete!") can remain — celebration augments it.
      Use the existing CelebrationAnimation API; do not rewrite the animation itself.
    status: "untested"
    test_file: "app/src/test/java/com/sumgrid/ui/puzzle/PuzzleScreenCelebrationTest.kt"
