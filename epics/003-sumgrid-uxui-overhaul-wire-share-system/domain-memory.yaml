    - "Undo button exists on NumberPad and PuzzleViewModel tracks move history"
    - "NumberPad switches to 2-row layout for Medium (5x5) difficulty"
    - "Dark mode WCAG AA contrast ratios pass audit (4.5:1 minimum)"
    - "App survives 200% font scale with no overflow or clipping"
    - "Puzzle state persists across app kills (auto-save on every cell change)"
    - "Statistics screen shows total solved, avg/best times, completion heatmap"
    - "Daily reminder notification opt-in flow exists"
    - "Practice mode provides unlimited non-streak random puzzles"
    - "Enhanced celebration animation (confetti or equivalent) on completion"
    - "Reduce-motion preference is respected for pulsing flame and animations"
    - "Error shake/flash animation fires when a sum indicator turns red"
    - "Pencil/notes mode toggle exists for candidate number marking"
    - "App handles landscape layout or is locked to portrait in manifest"
    - "TalkBack traversal order: timer -> grid -> number pad"
    - "Hard (6x6) and Expert (7x7) difficulty levels are playable"
  constraints:
    - "Android-only (Kotlin/Jetpack Compose) — no iOS scope"
    - "Do not break existing streak/badge data persistence"
    - "Share card visual must remain consistent with existing ShareCardGenerator output"
    - "All UI must pass Material 3 design token compliance"
    - "No backend changes — all features are client-side"
    - "Each sprint should be independently shippable"

