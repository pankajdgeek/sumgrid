    Sprint 4 closes accessibility and polish gaps.
    Total scope: ~141 hours across 4 sprints, 31 tasks mapped to 20 discrete features.
  success_criteria:
    - "Share button is visible and functional on the puzzle completion screen"
    - "Earned streak badges are displayed on HomeScreen"
    - "Onboarding has a Skip option and a rules explanation overlay"
    - "Puzzle screen has a TopAppBar with back/exit button"
