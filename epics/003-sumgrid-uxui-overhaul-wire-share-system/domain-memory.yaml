goal:
  original_prompt: "SumGrid UX/UI overhaul: wire share system and badges, fix onboarding friction, build completion card, add undo, statistics screen, practice mode, accessibility fixes"
  expanded_description: |
    A full product UX/UI pass on SumGrid based on a 31-finding source-code audit.
    The single biggest opportunity is that the share system (ShareCardGenerator,
    ShareIntentLauncher) and badge system (StreakBadge enum) are fully implemented
    in code but are never surfaced in the UI — these are free wins in Sprint 1.
    The puzzle completion moment is the #1 retention touchpoint and is currently
