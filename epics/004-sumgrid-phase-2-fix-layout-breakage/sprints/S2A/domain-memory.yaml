goal:
  sprint_id: "S2A"
  name: "Critical Layout Fixes"
  estimate_hours: 12
  original_prompt: "Fix the most visually broken issues introduced by 5-difficulty expansion"
  expanded_description: >
    With 5 difficulty cards now displayed in a row, text truncates mid-word (e.g. 'Begin ner').
    Badge labels are cramped and unreadable. Unearned badges display in full color, removing
    the progression incentive. Empty editable cells are invisible against the dark background.
    First-time users see a disabled numpad with no instruction. All 5 items are P0/P1 severity
    and should ship first.
  success_criteria:
    - "All 5 difficulty card labels fully readable with no mid-word line breaks"
    - "Badge row shows emoji-only display; tap reveals name + description"
    - "Unearned badges rendered grayscale/dimmed; earned badges full color"
    - "Empty editable cells have a subtle background tint visible in dark mode"
    - "A 'Tap an empty cell to start' hint appears on puzzle load and disappears after first tap"

