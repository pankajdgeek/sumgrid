goal:
  sprint_id: "S2B"
  name: "Layout and Spacing Polish"
  estimate_hours: 16
  original_prompt: "Eliminate dead space, polish spacing, fix secondary visual issues across Home and Puzzle screens"
  expanded_description: >
    The puzzle screen has ~30% dead space between the grid and the numpad — empty black void.
    The Home screen may overflow on short devices (Oppo) given 5 difficulty cards, 5 status
    chips, badges, countdown, and the Play button. Today's Puzzles with 5 chips is compressed.
    The timer floats disconnected above the grid. The grid doesn't use full available width.
    Undo/clear blend into digit buttons. Zero-streak shows odd pulsing flame. Play button
    uses muted indigo instead of a CTA color. Unselected difficulty cards are barely visible.
    All these polish items build on the critical fixes from Sprint S2A.
  success_criteria:
    - "Puzzle screen grid vertically centered with numpad directly below it, ~16dp gap"
    - "Home screen wrapped in scroll container; no overflow on short devices"
    - "Today's Puzzles row condensed to initials or progress bar style with 5 items"
    - "Timer shown in TopAppBar trailing slot (e.g. '← Medium  00:00'); removed from body"
    - "Grid horizontal padding reduced to 8dp or less; cells are larger and more tappable"
    - "Undo and clear buttons visually distinct from digit buttons (color, separator, or weight)"
    - "Zero-streak shows 'Start your streak!' or hides section entirely"
    - "Play button uses tertiaryContainer (amber) for clear CTA distinction"
    - "Unselected difficulty cards have surfaceVariant background (alpha 0.15) and clear outline"

