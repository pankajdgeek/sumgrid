goal:
  sprint_id: "S2C"
  name: "UX Enhancements"
  estimate_hours: 20
  original_prompt: "Completed puzzle overlay, badge detail sheet, collapsible badge row, numpad animation, dgeek footer, first-cell pulse"
  expanded_description: >
    With layout fixed (S2A) and spacing polished (S2B), Sprint S2C adds UX richness.
    Difficulty cards should show a completion checkmark for solved puzzles. Badge taps should
    open a detail bottom sheet with name and progress info. On short devices, the badge row
    should collapse to a single chip. The numpad enable/disable should have a smooth transition
    animation. The 'More by dgeek' footer should be removed or wired to a real URL.
    First-time onboarding should include a pulsing animation on the first empty cell.
    These are medium-priority, medium-effort items that complete the Phase 2 experience.
  success_criteria:
    - "Difficulty cards display a checkmark overlay when puzzle is completed — DONE"
    - "Tapping any badge opens a bottom sheet with badge name, description, and progress indicator — DONE"
    - "On short screens, badge row collapses to a single chip; tap opens sheet — DONE"
    - "Numpad buttons animate smoothly from disabled-gray to enabled state (150ms tween) — DONE"
    - "dgeek footer removed from HomeScreen — DONE"
    - "First empty cell pulses on puzzle load as an onboarding cue; stops after first interaction — DONE"

